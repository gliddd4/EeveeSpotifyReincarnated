name: Build IPA (PATCHED)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "URL to a decrypted Spotify IPA (optional — IPA build is skipped if empty)"
        default: ""
        required: false
        type: string
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # releases/latest/download redirect avoids api.github.com rate limit (anon 60/hr -> 403)
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build .deb (rootless)
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH"   >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ─── IPA build (only when ipa_url is provided) ───────────────────
      
      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Patch Spotify binary (lyrics card gate NOP)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          # Unzip only the Spotify binary, patch 4 bytes at file offset
          # 0x34f584c (tbz w20, #0x0 → NOP), then update it back into the IPA.
          # This forces registerScrollProviderIn: to always register the
          # lyrics card provider, even for local files.
          export COPYFILE_DISABLE=1
          rm -rf patch_tmp && mkdir patch_tmp
          unzip -o spotify.ipa "Payload/Spotify.app/Spotify" -d patch_tmp

          BIN="patch_tmp/Payload/Spotify.app/Spotify"
          OFFSET=$((0x34f584c))

          # Verify the existing 4 bytes are the expected tbz instruction.
          EXISTING=$(xxd -s $OFFSET -l 4 -p "$BIN")
          echo "Bytes at offset 0x34f584c: $EXISTING"
          if [ "$EXISTING" != "f4040036" ]; then
            echo "::error::Unexpected bytes at 0x34f584c: $EXISTING (expected f4040036). Spotify build may differ."
            exit 1
          fi

          # Write NOP (0xD503201F, little-endian: 1f2003d5)
          printf '\x1f\x20\x03\xd5' | dd of="$BIN" bs=1 seek=$OFFSET conv=notrunc 2>/dev/null

          # Verify the patch was written.
          PATCHED=$(xxd -s $OFFSET -l 4 -p "$BIN")
          echo "Patched bytes at offset 0x34f584c: $PATCHED"
          if [ "$PATCHED" != "1f2003d5" ]; then
            echo "::error::Patch verification failed: $PATCHED (expected 1f2003d5)"
            exit 1
          fi

          echo "Lyrics card gate patched successfully (tbz → NOP)"

          # Delete the old binary from the IPA and re-add the patched one.
          # Using zip -u alone can silently skip if mtimes match (hot runner).
          zip -d ../spotify.ipa "Payload/Spotify.app/Spotify" 2>/dev/null || true
          cd patch_tmp && zip -X ../spotify.ipa "Payload/Spotify.app/Spotify" && cd ..
          rm -rf patch_tmp

      - name: Build zxPluginsInject.dylib
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: Fetch OpeninSafariSpotify extension (.appex)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          # "OpeninSafariSpotify" is commonly distributed as OpenSpotifySafariExtension.appex
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject deb + framework into IPA (cyan)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          # cyan: -du strips appex/Watch (we don't have a wildcard profile),
          # -m 15.0 sets MinimumOSVersion floor, -c 9 max compression.
          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: LC-inject zxPluginsInject (ipapatch)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib

      - name: Inject OpeninSafariSpotify extension into IPA PlugIns
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/PlugIns"
          rm -rf "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          # Repack only the Payload folder back into the IPA
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Strip Watch app (if any survived)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Stage alternate app icons
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Verify binary patch in final IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          FINAL_BYTES=$(unzip -p "$OUT_IPA" "Payload/Spotify.app/Spotify" | xxd -s $((0x34f584c)) -l 4 -p 2>/dev/null || echo "FAIL")
          echo "Final IPA bytes at 0x34f584c: $FINAL_BYTES"
          if [ "$FINAL_BYTES" != "1f2003d5" ]; then
            echo "::error::Binary patch LOST in final IPA (expected 1f2003d5, got $FINAL_BYTES). cyan may have discarded the patch."
            exit 1
          fi
          echo "Binary patch verified in final signed IPA"

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload IPA to filebin.net
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'filebin' || inputs.upload_method == 'both') }}
        run: |
          BIN="eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"
